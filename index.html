<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mars Mission 2.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background:
    radial-gradient(circle at 50% 20%, #bd6545, transparent 40%),
    linear-gradient(160deg, #180e27, #562b36, #17152c);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 750px;
  margin: auto;
  background: rgba(20,15,35,0.88);
  padding: 22px;
  border-radius: 20px;
}

h1 { color: #ff9567; }

.planet {
  font-size: 75px;
  margin: 10px;
}

.astronaut { font-size: 65px; }

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}

.stat {
  background: #382d48;
  padding: 13px;
  border-radius: 12px;
}

.bar {
  background: #171525;
  height: 13px;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.fill {
  height: 100%;
  background: #65d89b;
  transition: width 0.3s;
}

button {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border: none;
  border-radius: 10px;
  background: #ff8057;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #e65c38; }

.action {
  background: #493653;
  border: 1px solid #a47aab;
}

#message {
  background: #29233c;
  padding: 14px;
  border-radius: 10px;
  margin-top: 15px;
}

.small { color: #c9c1d7; }

</style>
</head>

<body>

<div class="container">

<h1>🚀 MARS MISSION 2.0</h1>
<h3>Junior Astronaut Survival Trainer</h3>

<div class="planet">🔴</div>
<div class="astronaut">👨‍🚀</div>

<h2 id="day">Ready for Mission?</h2>

<p class="small">
Your mission: Survive 5 days on Mars!
Manage your resources carefully.
</p>

<div class="stats">

<div class="stat">
🍎 Food: <span id="food">80</span>%
<div class="bar"><div id="foodBar" class="fill"></div></div>
</div>

<div class="stat">
💧 Water: <span id="water">80</span>%
<div class="bar"><div id="waterBar" class="fill"></div></div>
</div>

<div class="stat">
🫧 Oxygen: <span id="oxygen">80</span>%
<div class="bar"><div id="oxygenBar" class="fill"></div></div>
</div>

<div class="stat">
⚡ Power: <span id="power">80</span>%
<div class="bar"><div id="powerBar" class="fill"></div></div>
</div>

</div>

<div id="game">

<button onclick="startGame()">START MISSION 🚀</button>

</div>

<div id="message">
Welcome, Junior Astronaut!
</div>

</div>

<script>

let resources = {};
let day = 1;
let playing = false;

const actions = [
{
name: "🌱 Grow Food",
description: "Grow food in the greenhouse.",
effect: {food: 25, power: -8}
},
{
name: "💧 Recycle Water",
description: "Recycle water for the crew.",
effect: {water: 25, power: -8}
},
{
name: "🫧 Oxygen System",
description: "Produce oxygen for astronauts.",
effect: {oxygen: 25, power: -12}
},
{
name: "☀️ Solar Panels",
description: "Collect energy from sunlight.",
effect: {power: 30}
}
];

function startGame() {
resources = {
food: 80,
water: 80,
oxygen: 80,
power: 80
};

day = 1;
playing = true;

document.getElementById("message").innerText =
"Your Mars mission has started!";

update();
showActions();
}

function update() {

for (let key in resources) {

resources[key] = Math.max(
0, Math.min(100, resources[key])
);

document.getElementById(key).innerText =
resources[key];

document.getElementById(key + "Bar").style.width =
resources[key] + "%";
}

document.getElementById("day").innerText =
"📅 Mars Day " + day + " / 5";
}

function showActions() {

let html = "<h3>Choose Today's Action</h3>";

actions.forEach((action, index) => {

html += `
<button class="action"
onclick="performAction(${index})">
${action.name}<br>
<small>${action.description}</small>
</button>
`;

});

document.getElementById("game").innerHTML = html;
}

function performAction(index) {

if (!playing) return;

let action = actions[index];

for (let key in action.effect) {
resources[key] += action.effect[key];
}

resources.food -= 8;
resources.water -= 8;
resources.oxygen -= 8;
resources.power -= 5;

for (let key in resources) {
resources[key] = Math.max(
0, Math.min(100, resources[key])
);
}

document.getElementById("message").innerText =
action.description + " Daily resources consumed.";

update();

if (Object.values(resources).some(value => value <= 0)) {
endGame(false);
return;
}

if (day === 5) {
endGame(true);
return;
}

day++;
showActions();
}

function endGame(success) {

playing = false;

let score = Object.values(resources).reduce(
(total, value) => total + value, 0
);

if (success) {

document.getElementById("game").innerHTML = `
<h2>🎉 MISSION SUCCESSFUL!</h2>
<h3>You survived 5 days on Mars!</h3>
<h2>⭐ Score: ${score}/400</h2>
<button onclick="startGame()">PLAY AGAIN</button>
`;

document.getElementById("message").innerText =
"Excellent work, Junior Astronaut!";

} else {

document.getElementById("game").innerHTML = `
<h2>Mission Failed!</h2>
<p>One or more resources ran out.</p>
<h3>Score: ${score}/400</h3>
<button onclick="startGame()">TRY AGAIN</button>
`;

document.getElementById("message").innerText =
"Manage your resources more carefully next time.";
}

}

</script>

</body>
</html>
